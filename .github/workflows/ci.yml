# One Linux job runs `npm run check` at the repo root (S8b: Node only, no conda): the master drift check, the NIST
# unpack, the web check and build, the parity run against the frozen key, the browser e2e tests and the timed ones.
# D-077: a change made only of Markdown, docs/ and mockups/ runs only the drift check; the job still runs and reports,
# so a required "check" is never left waiting (a workflow-level paths filter would leave it pending). scripts/ci-scope.sh decides.
# Pinned runner: ubuntu-latest moved to 26.04 on 2026-11-09, where Playwright 1.60 can't install Chromium (LESSONS "ci").
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft PRs don't run CI; marking one ready does (CI-06).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD^1 is the PR's base on GitHub's merge commit
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-scope.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.scope.outputs.light == 'true'
        run: npm run drift
      - if: steps.scope.outputs.light != 'true'
        run: npm --prefix web ci
      # Chromium alone, from Playwright's download host. ubuntu-24.04 already has its system libraries; --with-deps only
      # added 9 optional fonts (CJK, Thai, X11) from Ubuntu's mirror, whose DNS failed twice on 2026-11-11 before any
      # test ran (runs 43043688194, 43045616029). The app ships its own fonts (web/public/fonts).
      - if: steps.scope.outputs.light != 'true'
        run: npm --prefix web exec -- playwright install chromium
      - if: steps.scope.outputs.light != 'true'
        env: # scripts/scope.mjs (D-082): a UI-only PR skips the engine-only steps; a push to main runs all of them
          CI_EVENT: ${{ github.event_name }}
        run: npm run check
