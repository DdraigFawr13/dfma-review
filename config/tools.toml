# Generic tools (spec "Tools"). Drill sizes are generated from these ranges, not copied from a table.

[drills]
match_tolerance_in = 0.0005   # a hole within this of a drill counts as that drill's size

[[drills.inch]]               # every 1/64 in from 1/64 to 1 in (inch and other files)
from_in = 0.015625
to_in = 1.0
step_in = 0.015625

[[drills.mm]]                 # mm files also accept these metric drills (D-013): 1.0 to 13.0 mm in 0.1 mm steps ...
from_mm = 1.0
to_mm = 13.0
step_mm = 0.1

[[drills.mm]]                 # ... and 13.5 to 25.0 mm in 0.5 mm steps
from_mm = 13.5
to_mm = 25.0
step_mm = 0.5

[end_mills]                   # inch end mills (spec "Tools"); every file uses them: no metric list in this version
inch = [0.03125, 0.0625, 0.09375, 0.125, 0.1875, 0.25, 0.375, 0.5, 0.625, 0.75, 1.0]

[turning]                     # spec "Tools": the lathe's own tools (S6)
bore_min_in = 0.5             # an on-axis hole this size and over is bored, not drilled
groove_widths_in = [0.125]    # grooving inserts: a groove takes the widest that fits; narrower grooves get the
                              # narrowest, marked undersized (nothing fits)

[roughing]                    # D-029: pockets and turned profiles get a roughing tool, then a finishing tool
pocket_width_share = 0.75     # assumption: the roughing end mill is the largest at most this share of the pocket's
                              # narrowest width, leaving stock for the finishing tool; only when larger than it
