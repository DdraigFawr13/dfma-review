# One environment for every machine, no Docker (D-004).
# Build: conda env create -f environment.yml   (or: micromamba create -f environment.yml)
# Exact versions resolved on conda-forge on 2026-11-06 (S1). Licences: README "Packages and licences".
name: dfma
channels:
  - conda-forge
dependencies:
  - python=3.12.16
  - pythonocc-core=8.0.1.2
  - nodejs=22.23.4
  - fastapi=0.162.0
  - uvicorn=0.54.0
  - python-multipart=0.0.33
  - pytest=9.2.0
  - httpx=0.28.1
  - playwright=1.60.0          # the Node driver on conda-forge
  - playwright-python=1.60.0   # the Python client; must match the driver (1.64.1 needs Node 24+)
  - pytest-playwright=0.10.0
  - pypdf=7.0.0
  - pip=26.2.2
  - pip:
      - -e ./service
