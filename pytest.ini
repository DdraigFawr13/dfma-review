[pytest]
testpaths = tests
pythonpath = tests
markers =
    e2e: browser end-to-end tests (run with: pytest -m e2e)
    browser_only: e2e tests of the browser-engine build only (run with: pytest -m e2e --engine browser)
    per_slice: run once per port slice, alone on the machine, before its PR is marked ready (D-058): pytest -m per_slice --engine browser
    timed: asserts a wall-clock limit; scripts/check.py runs these alone, after the parallel lanes, so other work can't slow them
