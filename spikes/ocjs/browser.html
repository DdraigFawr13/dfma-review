<script type="module">
  import init from '@taucad/opencascade.js';
  import { fingerprint } from '/core.mjs';
  window.run = async (names) => {
    const t0 = performance.now();
    const oc = await init({ locateFile: () => '/node_modules/@taucad/opencascade.js/dist/opencascade_full.wasm' });
    const init_s = (performance.now() - t0) / 1000;
    const out = {}, mem = {};
    for (const n of names) {
      const bytes = new Uint8Array(await (await fetch('/.cache/nist/' + n)).arrayBuffer());
      oc.FS.writeFile('/in.stp', bytes);
      try { out[n] = fingerprint(oc, '/in.stp'); } catch (e) { out[n] = { error: String(e) }; }
      oc.FS.unlink('/in.stp');
      mem[n] = window.__mem.length ? window.__mem[0].buffer.byteLength : null;
    }
    return { init_s, out, mem };
  };
  window.ready = true;
</script>
